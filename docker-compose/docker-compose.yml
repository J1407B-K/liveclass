services:
  etcd:
    image: bitnami/etcd:3.5
    container_name: etcd
    ports:
      - 2379:2379
      - 2380:2380
    volumes:
      - ./etcd/data:/bitnami/etcd-data
    environment:
      - TZ=Asia/Shanghai
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379

  livego:
    image: gwuhaolin/livego
    container_name: livego
    ports:
      - "1935:1935"   # RTMP 端口
      - "7001:7001"   # HTTP-API 或其他服务端口
      - "7002:7002"   # 可选端口
      - "8090:8090"   # Web 页面端口
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      # 挂载主配置文件到容器
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always


  redis-stack:
    image: redis/redis-stack:latest
    container_name: redis-stack
    ports:
      - "6380:6379"  # Redis port
      - "8001:8001"  # RedisInsight port
    volumes:
      - ./data/redis:/data
    environment:
      - REDIS_ARGS=--dir /data --appendonly no --save 1800 1
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
  #mysql和redis暂时没加

