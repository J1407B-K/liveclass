worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    ## 定义后端 API 上游组，轮询负载均衡
    upstream api_backend {
        # 每台服务器连续 3 次失败后 30s 内不调度请求
        server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;  # :contentReference[oaicite:2]{index=2}
        server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;  # :contentReference[oaicite:3]{index=3}
        server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;  # :contentReference[oaicite:4]{index=4}
    }

    server {
        listen 80 default_server;
        server_name _;

        # 将所有 /api/ 请求转发到上游组
        location /api/ {
            proxy_pass         http://api_backend;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            # 在连接错误、超时或 5xx 时重试其它后端，最多 2 次
            proxy_next_upstream       error timeout http_502 http_503 http_504;  # :contentReference[oaicite:5]{index=5}
            proxy_next_upstream_tries 2;                                        # :contentReference[oaicite:6]{index=6}

            # 可选超时设置
            proxy_connect_timeout 5s;
            proxy_read_timeout    10s;
        }
    }
}
