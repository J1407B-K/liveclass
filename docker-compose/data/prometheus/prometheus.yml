global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'kitex-rpc'
    static_configs:
      - targets:
          - 'host.docker.internal:10001'
          - 'host.docker.internal:10002'
          - 'host.docker.internal:10003'
          - 'host.docker.internal:10004'
          - 'host.docker.internal:10005'
          - 'host.docker.internal:10006'
          - 'host.docker.internal:10007'