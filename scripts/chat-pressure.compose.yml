name: liveclass-chat-pressure
services:
  mongo:
    image: mongo:7.0
    ports: ["127.0.0.1:27017:27017"]
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    ports: ["127.0.0.1:6379:6379"]
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: chatbench-local-only
      MYSQL_DATABASE: chatbench
    ports: ["127.0.0.1:3306:3306"]
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command: ["etcd", "--listen-client-urls=http://0.0.0.0:2379", "--advertise-client-urls=http://127.0.0.1:2379"]
    ports: ["127.0.0.1:2379:2379"]
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
