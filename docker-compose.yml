services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
    container_name: liveclass-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  dtm:
    image: yedf/dtm:1.19.0
    container_name: liveclass-dtm
    restart: unless-stopped
    environment:
      STORE_DRIVER: boltdb
      LOG_LEVEL: info
      HTTP_PORT: 36789
      GRPC_PORT: 36790
    ports:
      - "36789:36789"
      - "36790:36790"
    volumes:
      - dtmdata:/app

volumes:
  esdata:
  dtmdata:
