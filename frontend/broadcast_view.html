<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>LiveClass — 合并连麦音轨到直播流（教师自动收听）</title>
    <style>
        body { font-family: sans-serif; padding:1rem; }
        video, audio { width:48%; border:1px solid #ccc; margin:0.5rem; display: inline-block; vertical-align: top; }
        button, select, input { margin:0.5rem; }
        #whiteboard { width:100%; height:400px; border:1px solid #ccc; display:none; }
        #whiteboard iframe { width:100%; height:100%; border:none; }
        #teacherControls, #studentControls, #pullMicControls { margin-top:1rem; }
    </style>
</head>
<body>
<h2>LiveClass — 教师端自动收听连麦</h2>

<!-- 基本参数 -->
<div>
    <label>Lesson ID: <input id="lessonID" value="123"/></label>
    <label>JWT Token: <input id="token" style="width:300px" placeholder="your.jwt.token"/></label>
    <label>类型:
        <select id="broadcastType">
            <option value="camera">摄像头</option>
            <option value="screen">屏幕共享</option>
        </select>
    </label>
</div>

<!-- 开播/录制 & 观看 -->
<div>
    <button id="startBroadcast">老师开播</button>
    <button id="stopBroadcast" disabled>停止并上传录像</button>
    <button id="startView">学生观看</button>
</div>
<div>
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline controls></video>
    <!-- 教师自动收听学生连麦音轨 -->
    <audio id="teacherAudio" controls autoplay style="display:none;"></audio>
</div>

<!-- 白板协作 -->
<h3>Excalidraw 白板</h3>
<div id="whiteboard"><iframe allow="clipboard-read; clipboard-write"></iframe></div>

<!-- 学生：举手 + 上麦 -->
<div id="studentControls">
    <button id="btnRaiseHand">举手</button>
    <button id="btnPublishMic" disabled>上麦（推音频）</button>
</div>

<!-- 教师审批列表 -->
<div id="teacherControls" style="display:none">
    <h4>待审批举手（自动更新）</h4>
    <div id="raiseList"></div>
</div>

<!-- 拉取连麦（学生/其他观众用） -->
<div id="pullMicControls" style="display:none">
    <button id="btnPullMicAll">拉取连麦并合流</button>
</div>

<script>
    (async ()=>{
        const lessonID   = document.getElementById('lessonID');
        const tokenInput = document.getElementById('token');
        const bcType     = document.getElementById('broadcastType');
        const startB     = document.getElementById('startBroadcast');
        const stopB      = document.getElementById('stopBroadcast');
        const startV     = document.getElementById('startView');
        const localVid   = document.getElementById('localVideo');
        const remoteVid  = document.getElementById('remoteVideo');
        const teacherAud = document.getElementById('teacherAudio');
        const wbDiv      = document.getElementById('whiteboard');
        const wbIframe   = wbDiv.querySelector('iframe');
        const btnRaise   = document.getElementById('btnRaiseHand');
        const btnPubMic  = document.getElementById('btnPublishMic');
        const raiseList  = document.getElementById('raiseList');
        const stuCtrls   = document.getElementById('studentControls');
        const teaCtrls   = document.getElementById('teacherControls');
        const pullCtrls  = document.getElementById('pullMicControls');
        const pullBtn    = document.getElementById('btnPullMicAll');

        let pc, localStream, recorder, doRecord;
        let pcMic, pcPull, pcTeacherPull, pollInterval, recordChunks = [];

        async function api(url, opts={}) {
            opts.headers = Object.assign({'Authorization':'Bearer '+tokenInput.value}, opts.headers||{});
            const res = await fetch(url, opts);
            const js  = await res.json();
            if (js.resp.code !== 0) throw new Error(js.resp.msg);
            return js.resp.data;
        }

        function showWB(){
            wbIframe.src = `https://excalidraw.com/#room=lesson${encodeURIComponent(lessonID.value)}`;
            wbDiv.style.display = 'block';
        }
        function hideWB(){
            wbDiv.style.display = 'none';
            wbIframe.src = '';
        }

        async function getStream(){
            if (bcType.value === 'camera') {
                return navigator.mediaDevices.getUserMedia({video:true,audio:true});
            }
            const screen = await navigator.mediaDevices.getDisplayMedia({video:true});
            const mic    = await navigator.mediaDevices.getUserMedia({audio:true});
            const ms     = new MediaStream();
            screen.getVideoTracks().forEach(t=>ms.addTrack(t));
            mic.getAudioTracks().forEach(t=>ms.addTrack(t));
            return ms;
        }

        function makePC(recvOnly=false){
            if (pc) pc.close();
            pc = new RTCPeerConnection({iceServers:[]});
            pc.onicecandidate = e=>{ if(!e.candidate) console.log('ICE done'); };
            pc.oniceconnectionstatechange = ()=>console.log('ICE→',pc.iceConnectionState);
            if (recvOnly) {
                const ms = new MediaStream();
                remoteVid.srcObject = ms;
                remoteVid.muted = false;
                pc.addTransceiver('video',{direction:'recvonly'});
                pc.addTransceiver('audio',{direction:'recvonly'});
                pc.ontrack = ev => ms.addTrack(ev.track);
            }
            return pc;
        }

        async function doOffer(send){
            if (send) {
                localStream = await getStream();
                localVid.srcObject = localStream;
                makePC(false);
                localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
            } else {
                makePC(true);
            }
            const of = await pc.createOffer();
            await pc.setLocalDescription(of);
            await new Promise(r=>pc.onicecandidate=e=>!e.candidate&&r());
            return btoa(JSON.stringify(pc.localDescription));
        }

        async function recvAnswer(b64){
            let raw = b64.trim();
            if (raw.startsWith('"')) raw = JSON.parse(raw);
            const desc = JSON.parse(atob(raw));
            await pc.setRemoteDescription(desc);
        }

        async function pollRaise(){
            try {
                const data = await api(
                    `http://127.0.0.1:80/get_raise_hand?lesson_id=${encodeURIComponent(lessonID.value)}`,
                    {method:'GET'}
                );
                const list = data?data.split('/'):[];
                raiseList.innerHTML = list.map(id=>`
          <div>
            <span>${id}</span>
            <button class="appr" data-id="${id}">同意</button>
          </div>
        `).join('');
                document.querySelectorAll('.appr').forEach(b=>{
                    b.onclick = async ()=>{
                        const id = b.dataset.id;
                        const f  = new FormData();
                        f.append('lesson_id',lessonID.value);
                        f.append('stuid',id);
                        await api('http://127.0.0.1:80/approve_hand',{method:'PUT',body:f});
                        b.disabled = true;
                    };
                });
            } catch(e){ console.warn(e); }
        }

        async function doPublishMic(){
            const ms = await navigator.mediaDevices.getUserMedia({audio:true});
            if (pcMic) pcMic.close();
            pcMic = new RTCPeerConnection({iceServers:[]});
            ms.getAudioTracks().forEach(t=>pcMic.addTrack(t,ms));

            const of = await pcMic.createOffer();
            await pcMic.setLocalDescription(of);
            await new Promise(r=>pcMic.onicecandidate=e=>!e.candidate&&r());
            const b64  = btoa(JSON.stringify(pcMic.localDescription));
            const form = new FormData();
            form.append('lesson_id',lessonID.value);
            form.append('b64offer',  b64);
            const ans  = await api('http://127.0.0.1:80/publish_mic',{method:'POST',body:form});

            let raw = ans.trim();
            if (raw.startsWith('"')) raw = JSON.parse(raw);
            const desc = JSON.parse(atob(raw));
            await pcMic.setRemoteDescription(desc);

            await new Promise(r=>setTimeout(r,500));
        }

        // 教师端拉取学生音轨
        async function teacherPullMic(){
            if (pcTeacherPull) pcTeacherPull.close();
            pcTeacherPull = new RTCPeerConnection({iceServers:[]});
            pcTeacherPull.addTransceiver('audio',{direction:'recvonly'});
            const ms = new MediaStream();
            teacherAud.srcObject = ms;
            teacherAud.style.display = '';
            pcTeacherPull.ontrack = ev => ms.addTrack(ev.track);

            const of = await pcTeacherPull.createOffer();
            await pcTeacherPull.setLocalDescription(of);
            await new Promise(r=>pcTeacherPull.onicecandidate=e=>!e.candidate&&r());
            const b64 = btoa(JSON.stringify(pcTeacherPull.localDescription));
            const f   = new FormData();
            f.append('lesson_id',lessonID.value);
            f.append('b64offer', b64);
            const resp = await fetch('http://127.0.0.1:80/view_mic',{
                method:'POST',
                headers:{'Authorization':'Bearer '+tokenInput.value},
                body:f
            });
            const js = await resp.json();
            if (js.resp.code!==0) throw new Error(js.resp.msg);
            let raw2 = js.resp.data.trim();
            if (raw2.startsWith('"')) raw2 = JSON.parse(raw2);
            const rd = JSON.parse(atob(raw2));
            await pcTeacherPull.setRemoteDescription(rd);
        }

        // 1. 老师开播
        startB.onclick = async ()=>{
            if (!lessonID.value||!tokenInput.value) {
                return alert('请填写 Lesson ID 和 JWT Token');
            }
            doRecord = confirm('是否录制？');
            stopB.disabled = false;
            stuCtrls.style.display = 'none';
            teaCtrls.style.display = 'block';
            pullCtrls.style.display = 'block';
            showWB();

            const of = await doOffer(true);
            const f  = new FormData();
            f.append('lesson_id',lessonID.value);
            f.append('b64offer',  of);
            const ans = await api('http://127.0.0.1:80/broadcast',{method:'POST',body:f});
            await recvAnswer(ans);

            // 自动起一个 pullMic 连接，教师端实时收听连麦
            teacherPullMic();

            if (doRecord) {
                recordChunks = [];
                recorder = new MediaRecorder(localStream);
                recorder.ondataavailable = e=>e.data.size&&recordChunks.push(e.data);
                recorder.start(1000);
            }

            pollRaise();
            pollInterval = setInterval(pollRaise,5000);

            stopB.onclick = async ()=>{
                clearInterval(pollInterval);
                if (doRecord && recorder) {
                    recorder.stop();
                    recorder.onstop = async ()=>{
                        const blob=new Blob(recordChunks,{type:'video/webm'});
                        const up=new FormData();
                        up.append('lesson_id',lessonID.value);
                        up.append('file',blob,'rec.webm');
                        if (confirm('上传录制？')) {
                            await fetch('http://127.0.0.1:80/record_lesson_webrtc',{
                                method:'POST',
                                headers:{'Authorization':'Bearer '+tokenInput.value},
                                body: up
                            });
                            alert('上传完成');
                        }
                    };
                }
                pc.close(); pc=null;
                localVid.srcObject = null;
                hideWB();
                stopB.disabled = true;
            };
        };

        // 2. 学生观看
        startV.onclick = async ()=>{
            if (!lessonID.value||!tokenInput.value) {
                return alert('请填写 Lesson ID 和 JWT Token');
            }
            showWB();
            pullCtrls.style.display = 'block';
            const of = await doOffer(false);
            const f  = new FormData();
            f.append('lesson_id',lessonID.value);
            f.append('b64offer',  of);
            const ans = await api('http://127.0.0.1:80/view',{method:'POST',body:f});
            await recvAnswer(ans);
        };

        // 3. 学生举手
        btnRaise.onclick = async ()=>{
            try {
                const f=new FormData();
                f.append('lesson_id',lessonID.value);
                await api('http://127.0.0.1:80/raise_hand',{method:'PUT',body:f});
                alert('已举手');
                btnRaise.disabled = true;
                btnPubMic.disabled = false;
            } catch(e){
                alert(e.message);
            }
        };

        // 4. 学生上麦
        btnPubMic.onclick = async ()=>{
            try {
                await doPublishMic();
                alert('已上麦');
                btnPubMic.disabled = true;
            } catch(e){
                alert(e.message);
            }
        };

        // 5. 其他观众拉取连麦
        pullBtn.onclick = async ()=>{
            try {
                await doPublishMic();

                if (pcPull) pcPull.close();
                pcPull = new RTCPeerConnection({iceServers:[]});
                const ms = remoteVid.srcObject instanceof MediaStream
                    ? remoteVid.srcObject
                    : new MediaStream();
                remoteVid.srcObject = ms;
                remoteVid.muted = false;
                pcPull.addTransceiver('audio',{direction:'recvonly'});
                pcPull.ontrack = ev=> ms.addTrack(ev.track);

                const of = await pcPull.createOffer();
                await pcPull.setLocalDescription(of);
                await new Promise(r=>pcPull.onicecandidate=e=>!e.candidate&&r());
                const b64 = btoa(JSON.stringify(pcPull.localDescription));

                const f = new FormData();
                f.append('lesson_id',lessonID.value);
                f.append('b64offer', b64);
                const resp = await fetch('http://127.0.0.1:80/view_mic',{
                    method:'POST',
                    headers:{'Authorization':'Bearer '+tokenInput.value},
                    body:f
                });
                const js = await resp.json();
                if (js.resp.code!==0) throw new Error(js.resp.msg);
                let raw = js.resp.data.trim();
                if (raw.startsWith('"')) raw = JSON.parse(raw);
                const rd = JSON.parse(atob(raw));
                await pcPull.setRemoteDescription(rd);
            } catch(e){
                alert('拉取连麦出错：'+e.message);
            }
        };

        // 切教师界面
        lessonID.addEventListener('keyup', e=>{
            if (e.ctrlKey && e.key==='Enter') {
                stuCtrls.style.display = 'none';
                teaCtrls.style.display = 'block';
            }
        });

        // 清理
        window.addEventListener('beforeunload', ()=>{
            if(pc) pc.close();
            if(pcMic) pcMic.close();
            if(pcPull) pcPull.close();
            if(pcTeacherPull) pcTeacherPull.close();
            clearInterval(pollInterval);
            hideWB();
        });
    })();
</script>
</body>
</html>
