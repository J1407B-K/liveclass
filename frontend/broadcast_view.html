<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>课堂 Broadcast & View 调试版（本地音视频分离）</title>
    <style>
        video, audio { width: 48%; border: 1px solid #ccc; margin: 5px; }
        button { margin: 5px; }
    </style>
</head>
<body>
<h2>在线课堂：开播 & 观看 调试版（音视频分离）</h2>
<div>
    <label>Lesson ID: <input id="lessonID" value="lesson123" /></label>
    <label>JWT Token: <input id="token" style="width:300px" placeholder="your.jwt.token" /></label>
</div>
<div>
    <button id="startBroadcast">老师开播</button>
    <button id="stopBroadcast">停止开播</button>
    <button id="startView">学生观看</button>
</div>
<div>
    <video id="localVideo" autoplay muted playsinline></video>
    <!-- muted 确保浏览器能 autoplay 视频 -->
    <video id="remoteVideo" autoplay muted playsinline controls></video>
    <audio id="remoteAudio" controls autoplay></audio>
</div>
<script>
    (async () => {
        const lessonInput = document.getElementById('lessonID');
        const tokenInput  = document.getElementById('token');
        const localVideo  = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const remoteAudio = document.getElementById('remoteAudio');
        let pc;

        function createPC(viewer = false) {
            if (pc) pc.close();
            pc = new RTCPeerConnection({ iceServers: [] });
            pc.onicecandidate = e => {
                console.log('[Browser] ICE candidate →', e.candidate);
                if (!e.candidate) console.log('[Browser] ICE gathering complete');
            };
            pc.oniceconnectionstatechange = () => {
                console.log('[Browser] ICE state →', pc.iceConnectionState);
            };

            if (viewer) {
                // 分离出两个流
                const videoStream = new MediaStream();
                const audioStream = new MediaStream();
                remoteVideo.srcObject = videoStream;
                remoteAudio.srcObject = audioStream;

                pc.addTransceiver('video', { direction: 'recvonly' });
                pc.addTransceiver('audio', { direction: 'recvonly' });
                pc.ontrack = e => {
                    console.log('[Browser] ontrack kind=', e.track.kind);
                    if (e.track.kind === 'video') {
                        videoStream.addTrack(e.track);
                    } else if (e.track.kind === 'audio') {
                        audioStream.addTrack(e.track);
                    }
                };
            }

            return pc;
        }

        async function doOffer(isBroadcast) {
            let stream;
            if (isBroadcast) {
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = stream;
            }
            createPC(!isBroadcast);
            if (isBroadcast) {
                stream.getTracks().forEach(t => pc.addTrack(t, stream));
            }

            const offer = await pc.createOffer();
            console.log(isBroadcast
                ? '[Browser][Broadcast] localDescription SDP:\n' + offer.sdp
                : '[Browser][View]      localDescription SDP:\n' + offer.sdp
            );
            await pc.setLocalDescription(offer);

            // 等候 ICE 完成
            await new Promise(resolve => {
                pc.onicecandidate = e => {
                    if (!e.candidate) resolve();
                };
            });
            return btoa(JSON.stringify(pc.localDescription));
        }

        async function postFormData(path, body) {
            const form = new FormData();
            Object.entries(body).forEach(([k, v]) => form.append(k, v));
            const res = await fetch(path, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + tokenInput.value },
                body: form
            });
            const json = await res.json();
            // 兼容 resp.data 或 resp.Data
            const b64 = json.resp.data ?? json.resp.Data;
            console.log('[Browser] raw base64 from resp.data →', b64);
            return b64;
        }

        async function handleAnswer(b64answer) {
            let raw = b64answer.trim().replace(/[\r\n]/g, '');
            raw = raw.replace(/-/g, '+').replace(/_/g, '/');
            const jsonStr = atob(raw);
            console.log('[Browser] decoded JSON string →', jsonStr);
            const desc = JSON.parse(jsonStr);
            console.log('[Browser] answer SDP object →', desc);
            await pc.setRemoteDescription(desc);
        }

        document.getElementById('startBroadcast').onclick = async () => {
            const lessonID = lessonInput.value.trim();
            if (!lessonID || !tokenInput.value.trim()) {
                return alert('请填写 lesson_id 和 JWT token');
            }
            const b64offer = await doOffer(true);
            const b64answer = await postFormData('http://127.0.0.1:8080/broadcast', {
                lesson_id: lessonID,
                b64offer
            });
            await handleAnswer(b64answer);
        };

        document.getElementById('stopBroadcast').onclick = () => {
            if (pc) pc.close();
            pc = null;
            localVideo.srcObject = null;
        };

        document.getElementById('startView').onclick = async () => {
            const lessonID = lessonInput.value.trim();
            if (!lessonID || !tokenInput.value.trim()) {
                return alert('请填写 lesson_id 和 JWT token');
            }
            const b64offer = await doOffer(false);
            const b64answer = await postFormData('http://127.0.0.1:8080/view', {
                lesson_id: lessonID,
                b64offer
            });
            await handleAnswer(b64answer);
        };
    })();
</script>
</body>
</html>
